services:
  postgres:
    image: postgres:17
    container_name: ecoponto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecoponto
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ecoponto_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecoponto"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ecoponto_pgdata:
